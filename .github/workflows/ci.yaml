name: ESPSomfy-RTS

on: [push, pull_request]

# Build check for the one target this fork supports: ESP32-S3 with 16MB flash on
# Arduino core 3.x. See release.yaml for why the other chips are not built here.
env:
  ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: "https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json"
  ARDUINO_CLI_VERSION: "1.x"
  ARDUINO_ESP32_VERSION: "3.3.11"
  ARDUINO_JSON_VERSION: "6.21.5"
  ESPTOOL_VERSION: "4.7"
  PUB_SUB_CLIENT_VERSION: "2.8.0"
  PYTHON_VERSION: "3.10"
  SMARTRC_CC1101_VERSION: "3.0.2"
  WEB_SOCKET_VERSION: "2.4.0"
  FS_SIZE: "1572864"
  FS_OFFSET: "0x670000"
  FQBN: "esp32:esp32:esp32s3:JTAGAdapter=default,PSRAM=disabled,FlashMode=qio,FlashSize=16M,LoopCore=1,EventsCore=1,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,PartitionScheme=default_8MB,CPUFreq=240,UploadSpeed=921600,DebugLevel=none,EraseFlash=none"

jobs:
  build:
    name: ESP32S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: SomfyController

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ESPTool
        run: |
          python -m pip install --upgrade pip
          pip install esptool==${{ env.ESPTOOL_VERSION }}

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      - name: Configure Arduino CLI
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ env.ARDUINO_ESP32_VERSION }}

      - name: Configure Arduino Libraries
        run: |
          arduino-cli lib install ArduinoJson@${{ env.ARDUINO_JSON_VERSION }}
          arduino-cli lib install PubSubClient@${{ env.PUB_SUB_CLIENT_VERSION }}
          arduino-cli lib install SmartRC-CC1101-Driver-Lib@${{ env.SMARTRC_CC1101_VERSION }}
          arduino-cli lib install WebSockets@${{ env.WEB_SOCKET_VERSION }}

      - name: Create LittleFS
        # The mklittlefs that ships with the core, so the image is written by the same
        # littlefs version that mounts it. Text assets are gzipped; handleStreamFile()
        # serves a <file>.gz when it finds one.
        run: |
          cp -r SomfyController/data data-build
          find data-build -type f \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.svg" -o -name "*.json" \) \
            -exec gzip -9 -f {} +
          MKLITTLEFS=$(find ~/.arduino15/packages/esp32/tools/mklittlefs -name mklittlefs -type f | head -1)
          "$MKLITTLEFS" --create data-build --size ${{ env.FS_SIZE }} SomfyController.littlefs.bin

      - name: Build
        run: |
          mkdir -p build
          arduino-cli compile --clean --output-dir build --fqbn "${{ env.FQBN }}" --warnings default ./SomfyController

      - name: Onboard Image
        run: |
          python -m esptool --chip ESP32-S3 \
            merge_bin -o build/SomfyController.onboard.esp32s3.bin \
            0x0 build/SomfyController.ino.bootloader.bin \
            0x8000 build/SomfyController.ino.partitions.bin \
            0x10000 build/SomfyController.ino.bin \
            ${{ env.FS_OFFSET }} SomfyController.littlefs.bin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3
          path: |
            build/SomfyController.ino.bin
            build/SomfyController.ino.bootloader.bin
            build/SomfyController.ino.partitions.bin
            build/SomfyController.onboard.esp32s3.bin
            SomfyController.littlefs.bin
          retention-days: 5
