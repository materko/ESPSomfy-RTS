name: ESPSomfy-RTS

on: [push, pull_request]

# Build check for the one target this fork supports: ESP32-S3 with 16MB flash.
# Board settings and library versions come from platformio.ini, not from here.
env:
  PYTHON_VERSION: "3.11"
  ESPTOOL_VERSION: "4.7"
  FS_OFFSET: "0x670000"

jobs:
  build:
    name: ESP32S3
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and ESPTool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool==${{ env.ESPTOOL_VERSION }}

      - name: Build firmware
        run: pio run

      - name: Build filesystem
        run: pio run -t buildfs

      - name: Onboard image
        run: |
          python -m esptool --chip ESP32-S3 merge_bin \
            -o .pio/build/esp32s3/onboard.bin \
            0x0 .pio/build/esp32s3/firmware.factory.bin \
            ${{ env.FS_OFFSET }} .pio/build/esp32s3/littlefs.bin
          ls -l .pio/build/esp32s3/*.bin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/bootloader.bin
            .pio/build/esp32s3/partitions.bin
            .pio/build/esp32s3/littlefs.bin
            .pio/build/esp32s3/onboard.bin
          retention-days: 5
