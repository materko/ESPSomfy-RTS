name: ESPSomfy-RTS Release

on:
  release:
    types: [published]

# Builds through PlatformIO so that the versions and board settings come from
# platformio.ini - the same file used to build on a workstation. Nothing about the
# toolchain is pinned here any more; if it were, it could drift from what the hardware
# actually runs.
#
# This fork builds for the ESP32-S3 with 16MB flash only. See README.md for why it needs
# Arduino core 3.x and why the ESP32/C3/S2 targets upstream builds are gone.
env:
  PYTHON_VERSION: "3.11"
  ESPTOOL_VERSION: "4.7"
  # spiffs partition of partitions_8mb.csv
  FS_OFFSET: "0x670000"

jobs:
  build:
    name: ESP32S3
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Get Release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO and ESPTool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool==${{ env.ESPTOOL_VERSION }}

      - name: Build firmware
        run: pio run

      - name: Build filesystem
        # tools/pio_gzip_data.py gzips the web assets on the way in
        run: pio run -t buildfs

      - name: Onboard image
        # firmware.factory.bin already holds bootloader, partitions, boot_app0 and the
        # application from 0x0; only the filesystem has to be added.
        run: |
          cp .pio/build/esp32s3/firmware.bin SomfyController.ino.esp32s3.bin
          cp .pio/build/esp32s3/littlefs.bin SomfyController.littlefs.bin
          python -m esptool --chip ESP32-S3 merge_bin \
            -o SomfyController.onboard.esp32s3.bin \
            0x0 .pio/build/esp32s3/firmware.factory.bin \
            ${{ env.FS_OFFSET }} SomfyController.littlefs.bin
          zip SomfyController.onboard.esp32s3.bin.zip ./SomfyController.onboard.esp32s3.bin
          ls -l SomfyController.*

      # Asset names are what the updater in GitOTA.cpp downloads - do not rename them.
      - name: Upload LittleFS
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: SomfyController.littlefs.bin
          asset_path: SomfyController.littlefs.bin
          overwrite: true

      - name: Upload Firmware
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: SomfyController.ino.esp32s3.bin
          asset_path: SomfyController.ino.esp32s3.bin
          overwrite: true

      - name: Upload Onboard Image
        uses: shogo82148/actions-upload-release-asset@v1.7.5
        with:
          github_token: ${{ github.token }}
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_name: SomfyController.onboard.esp32s3.bin.zip
          asset_path: SomfyController.onboard.esp32s3.bin.zip
          overwrite: true
          asset_content_type: application/zip
