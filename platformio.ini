; ESPSomfy-RTS pre ESP32-S3-WROOM-1 N16R8.
;
; Zdrojaky zostavaju v korenovom adresari ako Arduino skica (src_dir = .), takze projekt
; ide otvorit aj v Arduino IDE. Nastavenia, ktore sa tam klikaju v menu Tools, su tu
; zapisane a verzionovane - vratane verzii kniznic, na ktorych to stoji.
;
; Preco pioarduino a nie oficialna platforma espressif32: ta sa zastavila na Arduino core
; 2.0.x, ktory na tomto module cita flash cez esp_flash_read nespravne (dorucí len prvych
; 32 bajtov z kazdej transakcie) a LittleFS sa nenamountuje. Verzia 55.03.311 nesie core
; 3.3.11, kde je to v poriadku.

[platformio]
src_dir = .
data_dir = data
default_envs = esp32s3

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; Prekladame len skicu z korena, nie build/ z Arduino IDE ani nic hlbsie.
build_src_filter = +<*.ino> +<*.cpp>

board_build.partitions = partitions_8mb.csv
board_build.filesystem = littlefs

; Toto je kombinacia, ktoru Arduino core zvoli pri "FlashMode: QIO 80MHz" a "PSRAM:
; Disabled": zavadzac qio, hlavicka obrazu dio, kniznice SDK pre qspi (bez PSRAM).
; Definicia dosky esp32-s3-devkitc-1 memory_type nenastavuje a bez neho si PlatformIO
; zvoli inu variantu SDK - subory z LittleFS sa potom servuju radovo pomalsie.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; USB CDC na konzolu (v Arduino IDE "USB Mode: Hardware CDC and JTAG" + "CDC On Boot").
; PSRAM zamerne nezapiname - kod ju nepouziva a oktalna PSRAM tohto modulu by len
; obsadila GPIO 33-37.
; ARDUINO_RUNNING_CORE / ARDUINO_EVENT_RUNNING_CORE zodpovedaju polozkam "Arduino Runs On"
; a "Events Run On" v menu Arduino IDE, obe nastavene na jadro 1. Bez nich by udalosti
; siete bezali na jadre 0 spolu s WiFi zasobnikom, co nie je to, na com je zariadenie
; odskusane.
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

; SmartRC 2.5.7 na core 3.x zamrzne v SPI ovladaci a dosku restartuje watchdog - navonok
; to vyzera, ze sa radio neda zapnut. 3.0.2 ma transakcie sparovane a casove limity.
; WebSockets sa berie z gitu podla znacky: register PlatformIO ponuka uz len 2.7.3,
; ale na doske je overena 2.4.0 - tu istu pouziva aj build cez arduino-cli.
lib_deps =
    bblanchon/ArduinoJson @ 6.21.5
    knolleary/PubSubClient @ 2.8.0
    lsatan/SmartRC-CC1101-Driver-Lib @ 3.0.2
    https://github.com/Links2004/arduinoWebSockets.git#2.4.0

; Pred zabalenim filesystemu zgzipuje text v data/ do docasnej kopie.
extra_scripts = pre:tools/pio_gzip_data.py

monitor_speed = 115200
upload_speed = 921600
